<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="web/stage.css">
<script>
  // what the QA helper (shoot.bl) reads back: every page error, in order
  window.__stageErrors = [];
  addEventListener("error", function (e) { window.__stageErrors.push(String(e.message || e)); });
  addEventListener("unhandledrejection", function (e) { window.__stageErrors.push("rejection: " + String(e.reason)); });
  try { var t = localStorage.getItem("stage-theme"); if (t) document.documentElement.setAttribute("data-theme", t);
        else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
  new MutationObserver(function () { try { localStorage.setItem("stage-theme", document.documentElement.getAttribute("data-theme")); } catch (e) {} })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div id="labels" aria-live="off"></div>
<main id="deck"><p class="loading">loading the brand model…</p></main>
<aside id="sheet" aria-hidden="true"></aside>
<nav class="chrome" aria-label="stage controls">
  <span class="brandmark"><span class="mark"></span>brand stage</span>
  <span class="progress"><i id="progress"></i></span>
  <span id="count" class="mono">— / —</span>
  <button id="prev" aria-label="previous slide">←</button>
  <button id="next" aria-label="next slide">→</button>
  <button id="grid" aria-label="gallery of slides">▦</button>
  <button id="theme" aria-label="day or night archive">◐</button>
  <a class="dl" href="api/model.edn" download="model.edn" title="the model as EDN: everything a datom db needs">edn</a>
</nav>
<script type="module">
  // three.js is plain ES; Beam Lisp reaches it as js/THREE, so it goes on globalThis first.
  import * as THREE from "./web/vendor/three.module.min.js";
  globalThis.THREE = THREE;
  await import("./out/ns/stage.client.main.mjs");
</script>
</body>
</html>
